[workspace]
resolver = "2"
members = ["crates/core", "crates/gateway", "crates/setup", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
