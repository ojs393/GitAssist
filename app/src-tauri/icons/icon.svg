<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Teal app icon: large shield + wolf face outline (matches --accent #0f766e). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.45" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)"/>
  <!-- Shield fills most of the tile -->
  <g fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 168 L812 278 V508 C812 698 678 840 512 908 C346 840 212 698 212 508 V278 Z"/>
  </g>
  <!-- Wolf face outline, centered in shield -->
  <g fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- head + ears -->
    <path d="M340 470
             L300 320 L390 380
             L512 340
             L634 380 L724 320
             L684 470
             Q684 620 512 700
             Q340 620 340 470 Z"/>
    <!-- eyes -->
    <circle cx="430" cy="500" r="18" fill="#ffffff" stroke="none"/>
    <circle cx="594" cy="500" r="18" fill="#ffffff" stroke="none"/>
    <!-- snout -->
    <path d="M470 560 Q512 600 554 560"/>
    <path d="M512 548 V590" stroke-width="36"/>
    <!-- nose tip -->
    <circle cx="512" cy="548" r="14" fill="#ffffff" stroke="none"/>
  </g>
</svg>
