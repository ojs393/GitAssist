[package]
name = "gitassist-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "gitassist"
path = "src/main.rs"

[dependencies]
gitassist-core = { path = "../core" }
gitassist-gateway = { path = "../gateway" }
gitassist-setup = { path = "../setup" }
anyhow = "1"
directories = "6"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
gitassist-core = { path = "../core" }
gitassist-gateway = { path = "../gateway" }
