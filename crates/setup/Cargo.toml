[package]
name = "gitassist-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gitassist-core = { path = "../core" }
gitassist-gateway = { path = "../gateway" }
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.34", default-features = false, features = ["cst", "serde_json"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
